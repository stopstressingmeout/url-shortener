databases:
  - name: urlshortener-db
    plan: free
    region: singapore          # closest Render region to Bangladesh
    databaseName: urlshortener
    user: urlshortener

services:
  - type: web
    name: url-shortener
    runtime: docker            # build from our Dockerfile
    plan: free
    region: singapore          # must match the database's region
    healthCheckPath: /health   # Render pings this to know the app is alive
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urlshortener-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true    # Render creates a random secret for you